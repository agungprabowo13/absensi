<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<title>Absensi QR</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17241e;--mute:#5d6e65;--faint:#8a9a91;--line:#d5ded9;--ok:#0f6b4f;--out:#b45309;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#101815;--card:#18231e;--ink:#e8f0ec;--mute:#9bb0a5;--faint:#6f857a;--line:#2a3a33;--ok:#3fb98f;--out:#f0a04b;--err:#f2837b}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
#jam{font-size:1.8rem;font-weight:600;font-variant-numeric:tabular-nums}
#tgl{color:var(--mute);font-size:.85rem}
.cam{position:relative;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:55%;aspect-ratio:1;border:3px solid #fff;border-radius:14px;opacity:.85;pointer-events:none}
.hasil{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 18px;min-height:104px}
.hasil .k{color:var(--mute);font-size:.85rem}
.hasil .n{font-size:1.5rem;font-weight:600;margin-top:2px}
.hasil .s{font-size:.85rem;margin-top:2px;color:var(--mute)}
.hasil.masuk{border-color:var(--ok)}.hasil.masuk .s{color:var(--ok)}
.hasil.pulang{border-color:var(--out)}.hasil.pulang .s{color:var(--out)}
.hasil.err{border-color:var(--err)}.hasil.err .n,.hasil.err .s{color:var(--err)}
.tombol{display:flex;gap:10px;margin-top:12px}
.tombol button{flex:1;padding:14px 10px;border:0;border-radius:12px;font:inherit;font-size:1.1rem;font-weight:600;color:#fff;cursor:pointer}
.tombol .bm{background:var(--ok)}
.tombol .bp{background:var(--out)}
.sisa{font-size:.8rem;color:var(--mute);margin-top:10px;text-align:center}
.daftar{background:var(--card);border-radius:14px;padding:14px 18px}
.daftar h2{font-size:.95rem;font-weight:600;margin-bottom:6px}
.baris{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.baris:last-child{border-bottom:0}
.baris span:last-child{color:var(--mute);font-variant-numeric:tabular-nums}
.baris .belum{color:var(--faint)}
.kaki{display:flex;justify-content:space-between;gap:10px;font-size:.75rem;color:var(--faint);padding:0 4px}
#antre{color:var(--out);font-size:.8rem;text-align:center;min-height:1.1em}
</style>
</head>
<body>
<main>
  <div class="top"><div id="jam">--:--:--</div><div id="tgl"></div></div>
  <div class="cam"><video id="v" playsinline muted></video><div class="frame"></div></div>
  <div class="hasil" id="hasil"></div>
  <div id="antre" role="status"></div>
  <div class="daftar"><h2>Absen hari ini</h2><div id="daftar"><div class="baris"><span class="belum">Memuat…</span></div></div></div>
  <div class="kaki"><span>Data tersimpan di Google Sheets</span><span id="sync"></span></div>
  <div class="kaki"><span id="info"></span></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
// ISI SEKALI: URL Web App dari Apps Script (berakhiran /exec)
const URL_WEB_APP = 'https://script.google.com/macros/s/AKfycbwMg5MhoNwhjnFHuLisY1sy8tjZ-zEnVJ56_RGoJUSOVXf9kfxn77t8MjzPbt_JmWjnig/exec';
// 'user' = kamera depan, 'environment' = kamera belakang
const FACING = 'user';
// Berapa detik pilihan Masuk/Pulang ditampilkan sebelum kembali ke kamera
const WAKTU_PILIH = 10;

const $ = id => document.getElementById(id);
const ld = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const siap = !URL_WEB_APP.startsWith('PASTE');
const hhmm = d => d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace('.', ':');

let queue = ld('absen_q', []), busy = false, last = { id: '', t: 0 };
let resetT, pilihId = null, pilihSisa = 0, pilihTimer = null;
let daftarNama = {};

setInterval(() => {
  const d = new Date();
  $('jam').textContent = d.toLocaleTimeString('id-ID', { hour12: false }).replace(/\./g, ':');
  $('tgl').textContent = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}, 1000);

/* Tampilan hasil */
function tampil(kelas, ket, nama, sub, tetap) {
  const h = $('hasil'); h.className = 'hasil ' + kelas;
  h.innerHTML = '<div class="k"></div><div class="n"></div><div class="s"></div>';
  h.children[0].textContent = ket; h.children[1].textContent = nama; h.children[2].textContent = sub || '';
  clearTimeout(resetT);
  if (!tetap) resetT = setTimeout(diam, 5000);
}
function diam() { tampil('', '', 'Arahkan QR ke kamera', 'Pilih Masuk atau Pulang setelah scan', true); }
diam();

/* Pilihan Masuk / Pulang setelah scan */
function tanyaStatus(id) {
  pilihId = id; pilihSisa = WAKTU_PILIH;
  const h = $('hasil'); h.className = 'hasil';
  h.innerHTML = '<div class="k">Pilih status</div><div class="n"></div><div class="tombol"><button class="bm" id="bm">Masuk</button><button class="bp" id="bp">Pulang</button></div><div class="sisa"></div>';
  h.querySelector('.n').textContent = daftarNama[id] || id;
  $('bm').onclick = () => pilih('masuk');
  $('bp').onclick = () => pilih('pulang');
  updSisa();
  clearInterval(pilihTimer);
  pilihTimer = setInterval(() => {
    pilihSisa--;
    if (pilihSisa <= 0) batal(); else updSisa();
  }, 1000);
}
function updSisa() {
  const s = document.querySelector('#hasil .sisa');
  if (s) s.textContent = 'Batal otomatis dalam ' + pilihSisa + ' detik';
}
function batal() {
  clearInterval(pilihTimer); pilihId = null; diam();
}
function pilih(status) {
  const id = pilihId; if (!id) return;
  clearInterval(pilihTimer); pilihId = null;
  last = { id, t: Date.now() };
  catat({ id, status, ts: new Date().toISOString() });
}

/* Kirim ke spreadsheet */
simpanAntrean();
function simpanAntrean() {
  sv('absen_q', queue);
  $('antre').textContent = queue.length ? queue.length + ' absen menunggu dikirim ke spreadsheet' : '';
}
async function kirim(item) {
  // tanpa header khusus agar tidak memicu preflight CORS di Apps Script
  const r = await fetch(URL_WEB_APP, { method: 'POST', body: JSON.stringify(item) });
  return r.json();
}
function tanggapi(j) {
  if (j.ok) {
    const masuk = j.jenis === 'masuk';
    tampil(masuk ? 'masuk' : 'pulang', (masuk ? 'Masuk pukul ' : 'Pulang pukul ') + j.jam, j.nama,
      masuk ? 'Absen masuk tercatat' : 'Absen pulang tercatat');
  } else {
    tampil('err', 'Tidak tercatat', j.pesan || 'Gagal mencatat', 'Coba lagi atau hubungi admin');
  }
}
async function catat(item) {
  tampil('', 'Memproses…', daftarNama[item.id] || item.id, '', true);
  try { tanggapi(await kirim(item)); muatHari(); }
  catch {
    queue.push(item); simpanAntrean();
    tampil('pulang', 'Tersimpan di HP', 'Belum ada internet', 'Akan dikirim otomatis nanti');
  }
}
async function kirimAntrean() {
  if (!siap || !queue.length || !navigator.onLine) return;
  for (const item of [...queue]) {
    try { await kirim(item); queue = queue.filter(x => x !== item); simpanAntrean(); }
    catch { break; }
  }
  muatHari();
}
addEventListener('online', kirimAntrean);
setInterval(kirimAntrean, 30000);

/* Daftar absen hari ini, diambil dari spreadsheet */
async function muatHari() {
  if (!siap) { $('daftar').innerHTML = '<div class="baris"><span class="belum">URL Web App belum diisi</span></div>'; return; }
  try {
    const j = await (await fetch(URL_WEB_APP + '?aksi=hari')).json();
    const box = $('daftar'); box.innerHTML = '';
    daftarNama = {};
    (j.rows || []).forEach(r => {
      daftarNama[r.id] = r.nama;
      const d = document.createElement('div'); d.className = 'baris';
      const a = document.createElement('span'), b = document.createElement('span');
      a.textContent = r.nama;
      if (r.pulang) b.textContent = 'Masuk ' + r.masuk + ' · Pulang ' + r.pulang;
      else if (r.masuk) b.textContent = 'Masuk ' + r.masuk;
      else { b.textContent = 'Belum absen'; b.className = 'belum'; }
      d.append(a, b); box.append(d);
    });
    if (!box.children.length) box.innerHTML = '<div class="baris"><span class="belum">Belum ada data</span></div>';
    $('sync').textContent = 'Terakhir sinkron ' + hhmm(new Date());
  } catch { $('sync').textContent = 'Gagal memuat daftar'; }
}
setInterval(muatHari, 60000);

/* Kamera dan pemindai QR */
const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
const detektor = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
$('info').textContent = 'v6 · pemindai: ' + (detektor ? 'bawaan Chrome' : (typeof jsQR !== 'undefined' ? 'jsQR' : 'BELUM DIMUAT'));
let lastScan = 0, sedangBaca = false;

function onCode(id) {
  if (pilihId || busy) return;
  if (id === last.id && Date.now() - last.t < 5000) return;
  if (!siap) { tampil('err', 'Belum siap', 'URL Web App belum diisi', 'Isi baris URL_WEB_APP di file index.html'); return; }
  tanyaStatus(id);
}

async function mulaiKamera() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: FACING, width: { ideal: 1280 } }, audio: false });
    $('v').srcObject = s; await $('v').play(); loop();
  } catch { tampil('err', 'Kamera tidak bisa dibuka', 'Izinkan akses kamera di Chrome', 'Buka lewat alamat HTTPS (misalnya GitHub Pages)', true); }
}
async function loop(ts) {
  requestAnimationFrame(loop);
  const v = $('v');
  // kamera berhenti membaca saat pilihan Masuk/Pulang sedang tampil
  if (!v.videoWidth || sedangBaca || pilihId || ts - lastScan < 200) return;
  lastScan = ts; sedangBaca = true;
  try {
    let kode = '';
    if (detektor) { const r = await detektor.detect(v); if (r.length) kode = r[0].rawValue; }
    if (!kode && typeof jsQR !== 'undefined') {
      const w = Math.min(v.videoWidth, 960), h = Math.round(w * v.videoHeight / v.videoWidth);
      cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
      const c = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
      if (c) kode = c.data;
    }
    if (kode) onCode(kode.trim());
  } catch (e) {}
  sedangBaca = false;
}

mulaiKamera(); muatHari();
</script>
</body>
</html>
